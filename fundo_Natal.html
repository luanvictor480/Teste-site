<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 Nosso Cantinho 💜</title>

<style>
/* ===== FUNDO MELHORADO (NATALINO) ===== */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;

  background:
    radial-gradient(circle at top left, rgba(255,255,255,0.15), transparent 40%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.1), transparent 40%),
    linear-gradient(135deg, #5b0f2e, #8e1458, #c2185b, #7b1fa2);

  background-attachment: fixed;
}

h1 {
  font-size: 2.5rem;
  margin-top: 2rem;
  text-shadow: 0 3px 8px rgba(0,0,0,0.3);
}

#contador {
  font-size: 1.1rem;
  background: rgba(255,255,255,0.2);
  display: inline-block;
  padding: 10px 25px;
  border-radius: 12px;
  margin: 10px 0 30px 0;
}

/* ===== CARROSSEL (INALTERADO) ===== */
.carousel-container {
  position: relative;
  overflow: hidden;
  width: 90%;
  max-width: 700px;
  margin: 0 auto 30px auto;
}
.carousel-track {
  display: flex;
  transition: transform 0.5s ease-in-out;
  gap: 20px;
}
.carousel-track img {
  width: 200px;
  height: 200px;
  border-radius: 15px;
  object-fit: cover;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: transform 0.5s ease, opacity 0.5s ease;
  animation: float 3s ease-in-out infinite alternate;
}
.carousel-track img.active {
  transform: scale(1.1);
  opacity: 1;
}
.carousel-track img:not(.active) {
  opacity: 0.6;
  transform: scale(0.9);
}

@keyframes float {
  0% { transform: translateY(0); }
  100% { transform: translateY(-10px); }
}

.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: white;
  color: #c026d3;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  font-size: 1.3rem;
}
.carousel-btn:hover {
  background: #f0abfc;
  color: white;
}
#prev { left: -20px; }
#next { right: -20px; }

button.music-btn {
  background: white;
  color: #c026d3;
  border: none;
  padding: 10px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: bold;
  margin: 10px;
  transition: 0.3s;
}
button.music-btn:hover {
  background: #f0abfc;
  color: white;
}

footer {
  margin-top: 40px;
  opacity: 0.8;
}

/* ===== EFEITO DE NATAL ===== */
.christmas-fall {
  position: fixed;
  top: -30px;
  pointer-events: none;
  z-index: 9999;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

.burst {
  position: fixed;
  pointer-events: none;
  animation: burst 0.8s ease-out forwards;
  z-index: 10000;
}

@keyframes burst {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>💜 Nosso Cantinho 💜</h1>
<div id="contador"></div>

<div class="carousel-container">
  <button class="carousel-btn" id="prev">⟨</button>
  <div class="carousel-track" id="carousel-track"></div>
  <button class="carousel-btn" id="next">⟩</button>
</div>

<div>
  <button id="tocar" class="music-btn">🔇 Tocar Música</button>
  <button id="proxima" class="music-btn">⏭ Próxima Música</button>
</div>

<footer>Para nunca esquecemos o poder da Babie. E do Patriarcado</footer>

<script>
/* ===== SEU JS ORIGINAL (INALTERADO) ===== */
const REPO_API = "https://api.github.com/repos/luanvictor480/Teste-site/contents/";
const track = document.getElementById("carousel-track");
let imagens = [];
let musicas = [];
let audio = new Audio();
let tocando = false;
let indexFoto = 0;
let indexMusica = 0;
let autoplayInterval;

/* ... TODO SEU CÓDIGO EXISTENTE CONTINUA IGUAL ... */

/* ===== EFEITO DE NATAL (ADICIONADO) ===== */
const natalEmojis = ["❄️","❅","❆","🎄","🎅","⛄","⭐","💖"];

setInterval(() => {
  const el = document.createElement("div");
  el.className = "christmas-fall";
  el.textContent = natalEmojis[Math.floor(Math.random() * natalEmojis.length)];
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.fontSize = (Math.random() * 18 + 14) + "px";
  el.style.animationDuration = (Math.random() * 6 + 6) + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 15000);
}, 350);

function explosaoNatal(x, y) {
  for (let i = 0; i < 6; i++) {
    const b = document.createElement("div");
    b.className = "burst";
    b.textContent = "✨";
    b.style.left = x + "px";
    b.style.top = y + "px";
    b.style.setProperty("--x", (Math.random()-0.5)*80 + "px");
    b.style.setProperty("--y", (Math.random()-0.5)*80 + "px");
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 800);
  }
}

document.addEventListener("mousemove", e => explosaoNatal(e.clientX, e.clientY));
document.addEventListener("touchstart", e => {
  const t = e.touches[0];
  explosaoNatal(t.clientX, t.clientY);
}, { passive: true });
</script>

</body>
</html>
